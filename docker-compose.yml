x-ml-image: &ml-image
  image: habitus-ml:local
  build:
    context: .
    dockerfile: Dockerfile.ml

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_USER: habitus
      POSTGRES_PASSWORD: habitus
      POSTGRES_DB: habitus
    ports:
      - "5544:5432"
    # Дефолтные 64 МБ /dev/shm тесны для параллельных воркеров
    # (dynamic_shared_memory_type=posix — сегменты лежат именно там). Профилактика:
    # к падениям бэкендов, которые ловились раньше, отношения не имела — те шли от
    # эмуляции amd64-образа на Apple Silicon, см. Dockerfile.db.
    shm_size: 1gb
    volumes:
      - habitus_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitus -d habitus"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-model-cache:
    <<: *ml-image
    command: ["python", "-m", "habitus.online.preload_models"]
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - habitus_hf:/root/.cache/huggingface
    restart: "no"

  ml-service:
    <<: *ml-image
    environment:
      DB_DSN: postgresql://habitus:habitus@db:5432/habitus
      HF_HOME: /root/.cache/huggingface
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ORS_API_KEY: ${ORS_API_KEY:-}
      # Ручки латентности реранка — он занимает львиную долю времени поиска.
      # Внутрь контейнера .env не попадает, поэтому без этого проброса покрутить
      # их можно было только правкой кода. Числа обязаны быть непустыми: пустую
      # строку pydantic не приведёт к int и уронит сервис на старте. Значения
      # дублируют дефолты habitus/config.py — источник правды там.
      RERANK_POOL_N: "${RERANK_POOL_N:-30}"
      RERANK_POOL_N_CPU: "${RERANK_POOL_N_CPU:-30}"
      RERANK_MAX_LENGTH: "${RERANK_MAX_LENGTH:-128}"
    volumes:
      - habitus_hf:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      ml-model-cache:
        condition: service_completed_successfully
    # Порт 8000 наружу не пробрасывается (Task 8): ml-service — внутренний
    # сервис, доступ к нему в обход Go-шлюза означал бы прямой доступ к
    # БД-запросам и к оплаченному ключу OpenRouter без авторизации и без
    # рейт-лимита. Внутри сети compose шлюз ходит к нему по имени сервиса
    # (ML_SERVICE_URL=http://ml-service:8000), и это не требует publish.
    # Для локальной отладки проброс можно добавить в
    # docker-compose.override.yml (он gitignored и в репозиторий не попадает).
    healthcheck:
      # Model files are downloaded by ml-model-cache. The Go backend performs
      # one synchronous /search before opening its HTTP listener so this
      # process has also loaded the cached weights into memory.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
    environment:
      DB_DSN: postgresql://habitus:habitus@db:5432/habitus
      ML_SERVICE_URL: http://ml-service:8000
      # 120, а не 60: на машине без GPU кросс-энкодер реранка — десятки секунд,
      # и при 60 шлюз рвал живой, успешный запрос по таймауту, показывая
      # «ошибка ИИ». Бюджет режется не таймаутом, а RERANK_POOL_N выше.
      ML_SEARCH_TIMEOUT_S: "${ML_SEARCH_TIMEOUT_S:-120}"
      ML_WARMUP_TIMEOUT_S: "600"
      ML_DOSSIER_TIMEOUT_S: "30"
      ML_OBJECT_ASK_TIMEOUT_S: "45"
      ML_EXPLAIN_TIMEOUT_S: "60"
      HTTP_PORT: "8080"
      SESSION_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGIN: "http://localhost:3000"
      # Гость: первый поиск без регистрации (см. .env.example). Без этих
      # переменных их нельзя ни поднять, ни опустить в контейнере — сервис
      # использует явный whitelist ниже, а не env_file.
      GUEST_RETENTION_DAYS: "${GUEST_RETENTION_DAYS:-30}"
      GUEST_SWEEP_MINUTES: "${GUEST_SWEEP_MINUTES:-720}"
      RATE_LIMIT_LLM_GUEST_PER_HOUR: "${RATE_LIMIT_LLM_GUEST_PER_HOUR:-5}"
      RATE_LIMIT_LLM_PER_HOUR: "${RATE_LIMIT_LLM_PER_HOUR:-30}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      # /health/ready, а не /health: фронт зависит от бэкенда по
      # service_healthy, и пускать его к шлюзу, под которым нет ML, незачем —
      # он получит «ошибку ИИ» на первом же поиске.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
        BACKEND_ORIGIN: http://backend:8080
    environment:
      # Внутри сети compose ходим по имени сервиса; браузер при этом всегда
      # обращается к /api/v1 на самом фронте, и Next проксирует дальше.
      BACKEND_ORIGIN: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Свой OpenRouteService. Профиль, а не обычный сервис: сборка графа —
  # десятки минут и гигабайты RAM, и обычному `docker compose up` это не нужно.
  # Поднимается явно:  docker compose --profile ors up -d ors
  #
  # Экстракт OSM в ./data/osm/ кладётся руками (в .gitignore, 105 МБ):
  #   curl -o data/osm/moscow-latest.osm.pbf \
  #     https://download.openstreetmap.fr/extracts/russia/central_federal_district/moscow-latest.osm.pbf
  # Именно Москва, а не ЦФО: граф округа не влезает в память, выделенную
  # Docker (проверено — OOM на сборке), а база продукта всё равно московская.
  # Geofabrik с некоторых сетей недоступен, отсюда зеркало OSM France.
  # Первый старт строит граф и отвечает 503 — это нормально, ждать по
  # healthcheck. Граф лежит в томе habitus_ors и переживает перезапуск.
  #
  # Зачем: публичный api.openrouteservice.org требует ключ и имеет суточный
  # потолок запросов, а изохроны нужны КАЖДОМУ поиску (point_predicate) —
  # на потоке квота кончится. Свой инстанс ключа не требует вовсе:
  # settings.ors_configured считает признаком настройки сам факт своего
  # ORS_BASE_URL (habitus/config.py).
  ors:
    image: openrouteservice/openrouteservice:v8.0.0
    profiles: ["ors"]
    ports:
      - "8082:8082"
    volumes:
      - ./data/osm:/home/ors/files:ro
      - ./ors-config.yml:/home/ors/ors-config.yml:ro
      - habitus_ors:/home/ors/graphs
    environment:
      # Конфигурация файлом: через env-переменные вида
      # ors.engine.profiles.car.enabled контейнер v8 падает на старте с
      # "Cannot invoke String.split(String) because this.profiles is null".
      ORS_CONFIG_LOCATION: /home/ors/ors-config.yml
      JAVA_OPTS: "-Xms1g -Xmx8g"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/ors/v2/health"]
      interval: 30s
      timeout: 5s
      retries: 60
      start_period: 60m

volumes:
  habitus_pg:
  habitus_hf:
  habitus_ors:
